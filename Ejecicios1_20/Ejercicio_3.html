<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Calcular área de un círculo</title>
</head>
<body>
    <h1>Ejercicio 3: Calcular el área de un círculo de 5cm de radio</h1>
    <p>Ejecuta el código en la consola del navegador (F12)</p>
    
    <script>
        /*
         Angie Sofia Guapacha Largo
        Enunciado del ejercicio: Calcular el área de un círculo de 5cm de radio (usar Math.PI)
        */
        
        // Función para calcular el área de un círculo
        function calcularAreaCirculo(radio) {
            // Fórmula: A = π * r²
            // Math.PI proporciona el valor de π (pi)
            // Math.pow(radio, 2) eleva el radio al cuadrado
            return Math.PI * Math.pow(radio, 2);
        }
        
        // Calcular el área del círculo de 5cm de radio
        const radio = 5; // cm
        const area = calcularAreaCirculo(radio);
        
        // Mostrar resultados en la consola
        console.log("=== EJERCICIO 3: ÁREA DE UN CÍRCULO ===");
        console.log(`Radio del círculo: ${radio} cm`);
        console.log(`Valor de π (Math.PI): ${Math.PI}`);
        console.log(`Área del círculo: ${area} cm²`);
        console.log(`Área redondeada a 2 decimales: ${Math.round(area * 100) / 100} cm²`);
        console.log("=====================================");
        
        // Ejemplos adicionales con diferentes radios
        console.log("\n=== EJEMPLOS ADICIONALES ===");
        const radios = [1, 3, 7, 10];
        
        radios.forEach(r => {
            const areaCalculada = calcularAreaCirculo(r);
            const areaRedondeada = Math.round(areaCalculada * 100) / 100;
            console.log(`Radio: ${r} cm → Área: ${areaRedondeada} cm²`);
        });
        
        console.log("===========================");
        
        // Mostrar la fórmula utilizada
        console.log("\n=== FÓRMULA UTILIZADA ===");
        console.log("A = π × r²");
        console.log("Donde:");
        console.log("- A = Área del círculo");
        console.log("- π = Math.PI (aproximadamente 3.14159)");
        console.log("- r = Radio del círculo");
        console.log("========================");
        
        // Instrucciones para el usuario
        console.log("\n💡 Puedes calcular el área de otros círculos escribiendo:");
        console.log("   calcularAreaCirculo(radio)");
        console.log("   Ejemplo: calcularAreaCirculo(8)");
    </script>
</body>
</html>
